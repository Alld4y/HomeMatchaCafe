<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
		<meta name="theme-color" content="#184a23" />
		<meta name="description" content="Home Matcha Cafe - สัมผัสความละมุนของมัทฉะแท้เกรดพิธีการ ณ โรงพยาบาลทองผาภูมิ สั่งง่าย ส่งไวถึงมือ" />
		<title>Home Matcha Cafe | โฮมมัทฉะคาเฟ่ @ รพ.ทองผาภูมิ</title>

		<!-- Favicon & Touch Icons -->
		<link rel="icon" type="image/x-icon" href="/favicon.ico" />
		<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />

		<!-- iOS Safari & PWA Meta -->
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="Matcha Cafe" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="application-name" content="Home Matcha Cafe" />

		<!-- Capture early beforeinstallprompt for Android & PC PWA installation -->
		<script>
			window.__deferredInstallPrompt = null;
			window.addEventListener('beforeinstallprompt', function(e) {
				e.preventDefault();
				window.__deferredInstallPrompt = e;
				window.dispatchEvent(new CustomEvent('pwa-can-install', { detail: e }));
			});
		</script>

		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600;700;800&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="matcha-theme">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
